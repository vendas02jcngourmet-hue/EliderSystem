<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESystemShop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: barra lateral de navegação + área de trabalho; no celular a barra vira abas no topo */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --line:#d5dcd9;
  --fg:#16211e; --muted:#5c6b66; --accent:#0f6b5c; --accent-fg:#ffffff; --accent-soft:#d8ece7;
  --warm:#c9631d; --good:#1d7a3e; --good-soft:#dcf0e2; --bad:#b3261e; --bad-soft:#f8dedb; --warn:#9a6700; --warn-soft:#f6ecd2;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#17201d; --sunk:#1f2a26; --line:#2c3a35;
  --fg:#e6eeeb; --muted:#93a39d; --accent:#4cc3a8; --accent-fg:#06221c; --accent-soft:#16352e;
  --warm:#f0914d; --good:#5fd08a; --good-soft:#163323; --bad:#ff8a80; --bad-soft:#3a1c1a; --warn:#e8bb52; --warn-soft:#352b12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201d; --sunk:#1f2a26; --line:#2c3a35;
  --fg:#e6eeeb; --muted:#93a39d; --accent:#4cc3a8; --accent-fg:#06221c; --accent-soft:#16352e;
  --warm:#f0914d; --good:#5fd08a; --good-soft:#163323; --bad:#ff8a80; --bad-soft:#3a1c1a; --warn:#e8bb52; --warn-soft:#352b12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;padding:0 10px 18px}
.brand span{color:var(--warm)}
.tab{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.tab:hover{background:var(--sunk);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.sync{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1180px;width:100%}
h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.sub{color:var(--muted);margin:2px 0 0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi .lb{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 12px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.alert{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.alert:last-child{border-bottom:0}
.pill{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-good{background:var(--good-soft);color:var(--good)} .p-neu{background:var(--sunk);color:var(--muted)}
.btn{all:unset;cursor:pointer;background:var(--accent);color:var(--accent-fg);font-weight:600;padding:9px 16px;border-radius:8px;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.lnk{all:unset;cursor:pointer;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
.lnk:hover{color:var(--fg);background:var(--sunk)}
.lnk.del:hover{color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--fg);width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,17,.45)}
dialog form{padding:22px;display:grid;gap:14px}
dialog h3{font-family:var(--f-display);font-size:20px;margin:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.calc{background:var(--sunk);border-radius:8px;padding:12px;font-size:13.5px;display:grid;gap:3px}
.calc div{display:flex;justify-content:space-between}
.calc .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px;margin-top:3px}
.actions{display:flex;gap:10px;justify-content:flex-end}
.note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;z-index:20}
.stockbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-left:8px}
.stockbar i{display:block;height:100%}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:10px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);z-index:5;gap:2px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand{padding:8px 10px 8px 4px;font-size:18px}
  .tab{white-space:nowrap;gap:6px}
  .sync,.who{display:none}
  nav.side{align-items:center}
  #logout{margin-left:auto}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
}
.f4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.f4{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.f4{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.kpi .v{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.login{min-height:100vh;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(380px,100%);display:grid;gap:14px}
.login .brand{padding:0;font-size:28px}
.err{color:var(--bad);font-size:13.5px;margin:0}
.who{font-size:12px;color:var(--muted);padding:0 10px;word-break:break-all}
</style>
</head>
<body>

<div class="login" id="loginView" hidden>
  <form id="loginForm">
    <div class="brand">ESystem<span>Shop</span></div>
    <p class="sub" style="margin:-8px 0 4px">Entre com o usuário criado no Supabase</p>
    <label>E-mail<input id="lEmail" type="email" autocomplete="username" required></label>
    <label>Senha<input id="lPass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lErr" hidden></p>
    <button class="btn" type="submit" id="lBtn" style="text-align:center">Entrar</button>
  </form>
</div>

<div class="login" id="setupView" hidden>
  <div class="panel" style="max-width:480px">
    <div class="brand" style="padding:0 0 10px">ESystem<span>Shop</span></div>
    <h2>Falta configurar o Supabase</h2>
    <p>Abra o arquivo <b>config.js</b> e preencha a <b>Project URL</b> e a chave <b>anon public</b> do seu projeto. O passo a passo está no README do repositório.</p>
  </div>
</div>

<div class="app" id="appView" hidden>
  <nav class="side" role="tablist" aria-label="Seções">
    <div class="brand">ESystem<span>Shop</span></div>
    <button class="tab" role="tab" data-view="painel" aria-selected="true">Painel</button>
    <button class="tab" role="tab" data-view="vendas">Vendas</button>
    <button class="tab" role="tab" data-view="estoque">Estoque <span class="badge" id="bEst" hidden></span></button>
    <button class="tab" role="tab" data-view="contas">Contas a pagar <span class="badge" id="bCon" hidden></span></button>
    <button class="tab" role="tab" data-view="precificacao">Precificação</button>
    <button class="tab" role="tab" data-view="fotos">Fotos com IA</button>
    <button class="tab" role="tab" data-view="config">Taxas</button>
    <div class="sync" id="sync">Conectando…</div>
    <div class="who" id="who"></div>
    <button class="tab" id="logout" style="font-size:13px">Sair</button>
  </nav>
  <main id="main"></main>
</div>

<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const BRL = v => (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtD = s => s ? s.split('-').reverse().join('/') : '—';
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysTo = s => Math.round((new Date(s+'T12:00')-new Date(today()+'T12:00'))/864e5);
const $ = id => document.getElementById(id);

const FAIXAS_PADRAO = [
  {ate:79.99, pct:20, fixo:4.5},
  {ate:99.99, pct:14, fixo:16},
  {ate:199.99, pct:14, fixo:20},
  {ate:499.99, pct:14, fixo:26},
  {ate:null, pct:14, fixo:26}
];
const S = { produtos:[], vendas:[], boletos:[], config:{faixas:FAIXAS_PADRAO, meio_abaixo:9}, view:'painel', filtro:'abertos', periodo:30 };
const faixas = () => (Array.isArray(S.config.faixas)&&S.config.faixas.length) ? S.config.faixas : FAIXAS_PADRAO;
function taxaUnit(preco){
  preco=+preco||0;
  const f=faixas().find(x=>x.ate==null||preco<=+x.ate)||faixas()[faixas().length-1];
  const fixo = preco<(+S.config.meio_abaixo||0) ? preco/2 : +f.fixo;
  return {pct:+f.pct, fixo, total:preco*(+f.pct)/100+fixo};
}

// ---------- Supabase ----------
const cfg = window.ESYS_CONFIG||{};
let sb = null, user = null;

async function boot(){
  if(!cfg.url || !cfg.anonKey || !window.supabase){ $('setupView').hidden=false; return; }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  const { data:{ session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e, s)=>{ const u=s?.user||null; if((u&&u.id)!==(user&&user.id)){ user=u; showApp(); } });
  user = session?.user || null;
  showApp();
}
function showApp(){
  $('loginView').hidden = !!user; $('appView').hidden = !user;
  if(user){ $('who').textContent=user.email||''; carregar(); }
}
async function carregar(){
  setSync('Carregando…');
  const [p,v,b,a] = await Promise.all([
    sb.from('esys_produtos').select('*').order('nome'),
    sb.from('esys_vendas').select('*').order('data',{ascending:false}).limit(5000),
    sb.from('esys_boletos').select('*').order('vencimento'),
    sb.from('esys_ajustes').select('*').maybeSingle()
  ]);
  const err = p.error||v.error||b.error||a.error;
  if(err){ setSync('Erro ao carregar'); toast(msgErro(err)); return; }
  S.produtos=p.data; S.vendas=v.data; S.boletos=b.data;
  if(a.data) S.config=a.data;
  setSync('Salvo no Supabase · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  render();
}
function msgErro(e){
  const m=(e&&(e.message||e.error_description))||'';
  if(/duplicate key|esys_vendas_pedido_unico/i.test(m)) return 'Esse pedido já foi lançado para esse produto.';
  if(/JWT|session|auth/i.test(m)) return 'Sua sessão expirou. Entre de novo.';
  if(/relation .* does not exist/i.test(m)) return 'Tabelas não encontradas. Rode o supabase/schema.sql no SQL Editor.';
  return 'Não foi possível salvar: '+m;
}
async function run(q, ok){
  const { error } = await q;
  if(error){ toast(msgErro(error)); return false; }
  if(ok) toast(ok);
  await carregar();
  return true;
}

$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('lErr').hidden=true; $('lBtn').textContent='Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email:$('lEmail').value.trim(), password:$('lPass').value });
  $('lBtn').textContent='Entrar';
  if(error){ $('lErr').textContent = /invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message; $('lErr').hidden=false; }
};
$('logout').onclick = async () => { await sb.auth.signOut(); user=null; S.produtos=[];S.vendas=[];S.boletos=[]; showApp(); };

function setSync(t){ $('sync').textContent=t; }
function toast(t){ const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }

// ---------- Cálculos ----------
function calcVenda(v){
  const qtd=+v.qtd||0, bruto=(+v.preco||0)*qtd;
  const taxa=v.taxa!=null&&v.taxa!==''?+v.taxa:taxaUnit(v.preco).total*qtd;
  const custo=(+v.custo_unit||0)*qtd, outros=+v.outros||0, imp=bruto*(+S.config.imposto_pct||0)/100;
  return {bruto,taxa,custo,outros,imp,lucro:bruto-taxa-imp-custo-outros};
}
const inPeriod=(d,n)=>daysTo(d)<=0&&daysTo(d)>-n;
function boletoStatus(b){ if(b.pago) return ['Pago','p-good']; const n=daysTo(b.vencimento); if(n<0) return [`Vencido há ${-n}d`,'p-bad']; if(n===0) return ['Vence hoje','p-bad']; if(n<=7) return [`Vence em ${n}d`,'p-warn']; return [`Em ${n} dias`,'p-neu']; }

// ---------- Telas ----------
function render(){
  document.querySelectorAll('.tab[data-view]').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===S.view));
  const baixo=S.produtos.filter(p=>(+p.estoque||0)<=(+p.minimo||0)).length;
  const urg=S.boletos.filter(b=>!b.pago&&daysTo(b.vencimento)<=3).length;
  $('bEst').hidden=!baixo; $('bEst').textContent=baixo; $('bCon').hidden=!urg; $('bCon').textContent=urg;
  $('main').innerHTML = ({painel,vendas,estoque,contas,config,precificacao,fotos})[S.view]();
  bind(); bindCalc(); bindFotos();
}

function painel(){
  const n=S.periodo, vs=S.vendas.filter(v=>inPeriod(v.data,n));
  const t=vs.reduce((a,v)=>{const c=calcVenda(v);a.bruto+=c.bruto;a.lucro+=c.lucro;a.taxa+=c.taxa;a.qtd+=+v.qtd||0;return a},{bruto:0,lucro:0,taxa:0,qtd:0});
  const margem=t.bruto?t.lucro/t.bruto*100:0;
  const aberto=S.boletos.filter(b=>!b.pago), totAberto=aberto.reduce((a,b)=>a+(+b.valor||0),0);
  const valEst=S.produtos.reduce((a,p)=>a+(+p.custo||0)*Math.max(0,+p.estoque||0),0);
  const alerts=[];
  aberto.filter(b=>daysTo(b.vencimento)<=7).forEach(b=>{const [l,c]=boletoStatus(b);alerts.push(`<div class="alert"><span>${esc(b.descricao)} · <span class="num">${BRL(b.valor)}</span></span><span class="pill ${c}">${l}</span></div>`)});
  S.produtos.filter(p=>(+p.estoque||0)<=(+p.minimo||0)).forEach(p=>alerts.push(`<div class="alert"><span>${esc(p.nome)}</span><span class="pill ${+p.estoque<=0?'p-bad':'p-warn'}">${+p.estoque<=0?'Sem estoque':'Restam '+p.estoque}</span></div>`));
  const top={}; vs.forEach(v=>{top[v.produto]=(top[v.produto]||0)+calcVenda(v).lucro});
  const topL=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="head"><div><h1>Painel</h1><p class="sub">Resumo dos últimos ${n} dias</p></div>
    <div class="filters" style="margin:0">${[7,30,90].map(d=>`<button class="chip" data-per="${d}" aria-pressed="${d===n}">${d} dias</button>`).join('')}</div></div>
  <div class="kpis">
    <div class="kpi"><div class="lb">Faturamento</div><div class="v">${BRL(t.bruto)}</div><div class="d">${vs.length} pedidos · ${t.qtd} itens</div></div>
    <div class="kpi"><div class="lb">Lucro líquido</div><div class="v ${t.lucro<0?'neg':'pos'}">${BRL(t.lucro)}</div><div class="d">Margem ${margem.toFixed(1).replace('.',',')}% · taxas ${BRL(t.taxa)}</div></div>
    <div class="kpi"><div class="lb">Contas em aberto</div><div class="v">${BRL(totAberto)}</div><div class="d">${aberto.length} boleto${aberto.length===1?'':'s'}</div></div>
    <div class="kpi"><div class="lb">Estoque a custo</div><div class="v">${BRL(valEst)}</div><div class="d">${S.produtos.length} produtos</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Faturamento e lucro por dia</h2>${chart(n)}</div>
    <div class="panel"><h2>Precisa de atenção</h2>${alerts.length?alerts.join(''):'<p class="note">Nada urgente. Boletos que vencem em até 7 dias e produtos abaixo do mínimo aparecem aqui.</p>'}</div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>Produtos que mais deram lucro</h2>${topL.length?topL.map(([p,l])=>`<div class="alert"><span>${esc(p)}</span><span class="num ${l<0?'neg':''}">${BRL(l)}</span></div>`).join(''):'<p class="note">Registre vendas para ver o ranking.</p>'}</div>`;
}
function chart(n){
  const days=[]; for(let i=n-1;i>=0;i--){const d=new Date(today()+'T12:00');d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10));}
  const by=Object.fromEntries(days.map(d=>[d,{b:0,l:0}]));
  S.vendas.forEach(v=>{if(by[v.data]){const c=calcVenda(v);by[v.data].b+=c.bruto;by[v.data].l+=c.lucro;}});
  const W=600,H=200,pl=52,pb=22,pt=10;
  const max=Math.max(10,...days.map(d=>by[d].b));
  const step=Math.pow(10,Math.floor(Math.log10(max))), top=Math.ceil(max/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-Math.max(0,v)/top), bw=(W-pl)/n;
  let g=''; for(let i=0;i<=4;i++){const v=top*i/4;g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v>=1000?(v/1000).toLocaleString('pt-BR')+'k':v}</text>`;}
  let bars='',pts=[];
  days.forEach((d,i)=>{const x=pl+i*bw;bars+=`<rect x="${x+bw*.15}" y="${y(by[d].b)}" width="${bw*.7}" height="${H-pb-y(by[d].b)}" fill="var(--accent-soft)"><title>${fmtD(d)}: ${BRL(by[d].b)}</title></rect>`;pts.push(`${x+bw/2},${y(by[d].l)}`);});
  const lbl=[0,Math.floor(n/2),n-1].map(i=>`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${fmtD(days[i]).slice(0,5)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de faturamento e lucro">${g}${bars}<polyline points="${pts.join(' ')}" fill="none" stroke="var(--warm)" stroke-width="2"/>${lbl}</svg>
  <p class="note" style="margin:8px 0 0">Barras: faturamento · Linha laranja: lucro líquido</p>`;
}

// ---------- Precificação ----------
const impPct = () => (+S.config.imposto_pct||0)/100;
function lucroEm(P, custoTotal){
  P=+P||0; const t=taxaUnit(P), imp=P*impPct();
  return {preco:P, taxa:t.total, pct:t.pct, fixo:t.fixo, imp, custo:custoTotal, lucro:P-t.total-imp-custoTotal, margem:P?(P-t.total-imp-custoTotal)/P:0};
}
// Menor preço que entrega a margem pedida (sobre o preço de venda), respeitando as faixas
function precoPara(m, custoTotal){
  const imp=impPct(), meio=+S.config.meio_abaixo||0, fx=faixas(); const sols=[];
  let lo=0;
  fx.forEach(f=>{
    const hi=f.ate==null?Infinity:+f.ate, c=(+f.pct)/100;
    // faixa normal (fixa em R$)
    const d=1-c-imp-m; if(d>0){ const P=(+f.fixo+custoTotal)/d; if(P>=Math.max(lo,meio)-1e-9 && P<=hi+1e-9) sols.push(P); }
    // itens abaixo do limite: fixa = metade do preço
    const d2=1-c-imp-m-0.5; if(d2>0 && lo<meio){ const P=custoTotal/d2; if(P>=lo && P<Math.min(meio,hi)) sols.push(P); }
    if(f.ate!=null) lo=Math.round((+f.ate+0.01)*100)/100;
  });
  return sols.length?Math.ceil(Math.min(...sols)*100)/100:null;
}
const pctFmt = x => (x*100).toFixed(1).replace('.',',')+'%';

    <div class="panel"><h2>Custos do produto</h2>
      <form id="calcF" class="fields" onsubmit="return false">
        <label class="full">Produto cadastrado (opcional)<select id="kProd"><option value="">Digitar os valores</option>${S.produtos.map(p=>`<option value="${p.id}" ${p.id===P.prod?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label>
        <label>Custo do produto (R$)<input id="kCus" type="number" step="0.01" min="0" value="${P.custo}" placeholder="0,00"></label>
        <label>Embalagem e outros por unidade (R$)<input id="kOut" type="number" step="0.01" min="0" value="${P.outros}" placeholder="0,00"></label>
        <label>Imposto sobre a venda (%)<input id="kImp" type="number" step="0.1" min="0" value="${+S.config.imposto_pct||0}"></label>
        <label>Margem de lucro desejada (%)<input id="kMar" type="number" step="0.5" min="0" max="80" value="${P.margem}"></label>
        <label class="full">Simular um preço de venda (R$)<input id="kPre" type="number" step="0.01" min="0" value="${P.preco}" placeholder="Em branco = usar o preço sugerido"></label>
      </form>
      <p class="note" style="margin:10px 0 0">Margem é o lucro dividido pelo preço de venda. O imposto fica salvo e também entra no lucro das vendas.</p>
    </div>
    <div class="panel" id="calcR"></div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>Tabela de preços por margem</h2><div class="tablewrap" style="border:0" id="calcT"></div></div>`;
}
function calcAtualiza(){
  if(!$('calcF')) return;
  const P=S.calc; P.prod=val('kProd'); P.custo=val('kCus'); P.outros=val('kOut'); P.margem=val('kMar'); P.preco=val('kPre');
  S.config.imposto_pct=+val('kImp')||0;
  const custoTotal=(+P.custo||0)+(+P.outros||0), m=(+P.margem||0)/100;
  const sug=precoPara(m,custoTotal), eq=precoPara(0,custoTotal);
  const preco=P.preco!==''?+P.preco:sug;
  const r=preco!=null?lucroEm(preco,custoTotal):null;
  // Dica de faixa: vender no topo de uma faixa mais barata pode render mais
  let dica='';
  if(r){ let best=null;
    faixas().forEach(f=>{ if(f.ate!=null && +f.ate<preco){ const x=lucroEm(+f.ate,custoTotal); if(x.lucro>=r.lucro && (!best||x.lucro>best.lucro)) best=x; } });
    if(best) dica=`<div class="calc" style="background:var(--warn-soft);color:var(--fg);margin-top:12px"><b>Atenção à faixa de taxa</b><span>Vendendo a <b class="num">${BRL(best.preco)}</b> você lucra <b class="num">${BRL(best.lucro)}</b>, igual ou mais do que a ${BRL(preco)} (${BRL(r.lucro)}), porque a taxa fixa sobe de faixa.</span></div>`;
  }
  $('calcR').innerHTML = !custoTotal&&P.preco===''
    ? `<h2>Resultado</h2><p class="note">Informe o custo do produto para ver o preço sugerido.</p>`
    : `<h2>Resultado</h2>
    <div class="kpis" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
      <div class="kpi"><div class="lb">Preço sugerido</div><div class="v">${sug!=null?BRL(sug):'—'}</div><div class="d">para ${String(P.margem||0).replace('.',',')}% de margem</div></div>
      <div class="kpi"><div class="lb">Preço mínimo</div><div class="v">${eq!=null?BRL(eq):'—'}</div><div class="d">abaixo disso dá prejuízo</div></div>
    </div>
    ${sug==null&&P.preco===''?'<p class="neg" style="margin:0">Essa margem não é possível com as taxas atuais. Tente uma margem menor.</p>':''}
    ${r?`<div class="calc">
      <div><span>Preço de venda ${P.preco!==''?'(simulado)':'(sugerido)'}</span><span class="num">${BRL(r.preco)}</span></div>
      <div><span>Taxa Shopee <small>(${r.pct}% + ${BRL(r.fixo)})</small></span><span class="num">− ${BRL(r.taxa)}</span></div>
      <div><span>Imposto <small>(${String(S.config.imposto_pct||0).replace('.',',')}%)</small></span><span class="num">− ${BRL(r.imp)}</span></div>
      <div><span>Custo + embalagem</span><span class="num">− ${BRL(r.custo)}</span></div>
      <div class="tot"><span>Lucro por unidade</span><span class="num ${r.lucro<0?'neg':'pos'}">${BRL(r.lucro)}</span></div>
      <div><span>Margem real</span><span class="num">${pctFmt(r.margem)}</span></div>
      <div><span>Markup sobre o custo</span><span class="num">${r.custo?((r.preco/r.custo).toFixed(2).replace('.',','))+'×':'—'}</span></div>
    </div>`:''}
    ${dica}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      ${P.prod&&r?`<button class="btn" id="kAplica">Usar ${BRL(r.preco)} no produto</button>`:''}
      <button class="btn ghost" id="kSalva">Salvar imposto e margem padrão</button>
    </div>`;
  const ms=[5,10,15,20,25,30,40,50];
  $('calcT').innerHTML = custoTotal ? `<table style="min-width:520px"><thead><tr><th>Margem</th><th class="r">Preço de venda</th><th class="r">Taxa Shopee</th><th class="r">Imposto</th><th class="r">Lucro/un.</th></tr></thead><tbody>
    ${ms.map(mm=>{const p=precoPara(mm/100,custoTotal); if(p==null) return `<tr><td>${mm}%</td><td class="r" colspan="4" style="color:var(--muted)">Não alcançável com essas taxas</td></tr>`; const x=lucroEm(p,custoTotal); return `<tr><td>${mm}%</td><td class="r num"><b>${BRL(p)}</b></td><td class="r num">${BRL(x.taxa)}</td><td class="r num">${BRL(x.imp)}</td><td class="r num pos">${BRL(x.lucro)}</td></tr>`}).join('')}
  </tbody></table>` : '<p class="note">Informe o custo para montar a tabela.</p>';
  const ap=$('kAplica'); if(ap) ap.onclick=()=>run(sb.from('esys_produtos').update({preco:r.preco}).eq('id',P.prod),'Preço atualizado no produto');
  $('kSalva').onclick=()=>run(sb.from('esys_ajustes').upsert({user_id:user.id,imposto_pct:+val('kImp')||0,margem_alvo:+val('kMar')||0,atualizado_em:new Date().toISOString()}),'Imposto e margem salvos');
}
function bindCalc(){
  const f=$('calcF'); if(!f) return;
  f.oninput=e=>{
    if(e.target.id==='kProd'){ const p=S.produtos.find(x=>x.id===val('kProd')); if(p){ $('kCus').value=p.custo; $('kPre').value=''; } }
    calcAtualiza();
  };
  calcAtualiza();
}

// ---------- Estúdio de fotos com IA ----------
S.fotos = [];
let bgLib = null;
async function carregaIA(){
  if(bgLib) return bgLib;
  const fontes=['https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm','https://esm.sh/@imgly/background-removal@1.5.8'];
  for(const u of fontes){ try{ const m=await import(u); bgLib=m.removeBackground||m.default; if(bgLib) return bgLib; }catch(e){ console.warn('Falha ao carregar',u,e); } }
  throw new Error('Não foi possível carregar o modelo de IA. Verifique a internet e tente de novo.');
}
function fotos(){
  const o=S.fotoOpt||(S.fotoOpt={tam:1000,margem:12,sombra:true,ajuste:'leve'});
  return `<div class="head"><div><h1>Fotos com IA</h1><p class="sub">Tira o fundo, aplica fundo branco e acerta luz e cor, sem mudar o produto</p></div></div>
  <div class="panel" style="margin-bottom:16px">
    <label for="fFile" id="drop" style="display:grid;place-items:center;gap:6px;border:2px dashed var(--line);border-radius:10px;padding:28px 16px;cursor:pointer;text-align:center;color:var(--muted)">
      <b style="color:var(--fg);font-size:16px">Escolher fotos dos produtos</b>
      <span>ou arraste para cá · JPG, PNG ou WEBP · várias de uma vez</span>
      <input id="fFile" type="file" accept="image/*" multiple hidden>
    </label>
    <div class="fields f4" style="margin-top:14px">
      <label>Tamanho final<select id="oTam"><option value="1000" ${o.tam==1000?'selected':''}>1000 × 1000 (Shopee)</option><option value="1200" ${o.tam==1200?'selected':''}>1200 × 1200</option><option value="2000" ${o.tam==2000?'selected':''}>2000 × 2000</option></select></label>
      <label>Espaço nas bordas<select id="oMar"><option value="6" ${o.margem==6?'selected':''}>Pouco</option><option value="12" ${o.margem==12?'selected':''}>Médio</option><option value="20" ${o.margem==20?'selected':''}>Bastante</option></select></label>
      <label>Luz e cor<select id="oAju"><option value="nenhum" ${o.ajuste=='nenhum'?'selected':''}>Sem ajuste</option><option value="leve" ${o.ajuste=='leve'?'selected':''}>Ajuste leve</option><option value="medio" ${o.ajuste=='medio'?'selected':''}>Ajuste médio</option></select></label>
      <label>Sombra<select id="oSom"><option value="1" ${o.sombra?'selected':''}>Sombra suave</option><option value="0" ${!o.sombra?'selected':''}>Sem sombra</option></select></label>
    </div>
    <p class="note" style="margin:10px 0 0">A IA roda no seu navegador: as fotos não são enviadas para nenhum servidor. Na primeira vez ela baixa o modelo (cerca de 40 a 80 MB), depois fica mais rápido. Formas, cores e detalhes do produto não são redesenhados; só o fundo é trocado e a luz é corrigida.</p>
  </div>
  ${S.fotos.length?`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h2 style="font-family:var(--f-display);font-size:17px;margin:0">${S.fotos.length} foto${S.fotos.length>1?'s':''}</h2><div style="display:flex;gap:8px">${S.fotos.some(f=>f.out)?'<button class="btn" id="fAll">Baixar todas</button>':''}<button class="btn ghost" id="fClr">Limpar</button></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">${S.fotos.map((f,i)=>`
    <div class="panel" style="padding:12px;display:grid;gap:10px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <figure style="margin:0"><img src="${f.src}" alt="Original" style="width:100%;aspect-ratio:1;object-fit:contain;background:var(--sunk);border-radius:6px"><figcaption class="note">Antes</figcaption></figure>
        <figure style="margin:0">${f.out?`<img src="${f.out}" alt="Resultado" style="width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)">`:`<div style="width:100%;aspect-ratio:1;display:grid;place-items:center;background:var(--sunk);border-radius:6px;font-size:12.5px;color:${f.erro?'var(--bad)':'var(--muted)'};padding:8px;text-align:center">${esc(f.erro||f.status||'Na fila')}</div>`}<figcaption class="note">Depois</figcaption></figure>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="note" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.nome)}</span>${f.out?`<a class="btn" style="padding:6px 12px;font-size:13px" href="${f.out}" download="${esc(f.nome.replace(/\.[^.]+$/,''))}-estudio.jpg">Baixar</a>`:''}</div>
    </div>`).join('')}</div>`:''}`;
}
function bindFotos(){
  const inp=$('fFile'); if(!inp) return;
  const opt=()=>{ S.fotoOpt={tam:+val('oTam'),margem:+val('oMar'),ajuste:val('oAju'),sombra:val('oSom')==='1'}; };
  ['oTam','oMar','oAju','oSom'].forEach(id=>$(id).onchange=()=>{opt();});
  inp.onchange=()=>{ adicionaFotos(inp.files); inp.value=''; };
  const d=$('drop');
  d.ondragover=e=>{e.preventDefault();d.style.borderColor='var(--accent)'};
  d.ondragleave=()=>d.style.borderColor='';
  d.ondrop=e=>{e.preventDefault();d.style.borderColor='';adicionaFotos(e.dataTransfer.files)};
  const c=$('fClr'); if(c) c.onclick=()=>{S.fotos.forEach(f=>{URL.revokeObjectURL(f.src);if(f.out)URL.revokeObjectURL(f.out)});S.fotos=[];render()};
  const a=$('fAll'); if(a) a.onclick=async()=>{ for(const f of S.fotos.filter(f=>f.out)){ const l=document.createElement('a'); l.href=f.out; l.download=f.nome.replace(/\.[^.]+$/,'')+'-estudio.jpg'; document.body.appendChild(l); l.click(); l.remove(); await new Promise(r=>setTimeout(r,350)); } };
}
let filaRodando=false;
function adicionaFotos(files){
  [...files].filter(f=>f.type.startsWith('image/')).forEach(f=>S.fotos.push({file:f,nome:f.name,src:URL.createObjectURL(f),status:'Na fila'}));
  render(); processaFila();
}
async function processaFila(){
  if(filaRodando) return; filaRodando=true;
  try{
    for(const f of S.fotos){
      if(f.out||f.erro||!f.file) continue;
      const opt={...S.fotoOpt};
      try{
        f.status='Carregando a IA…'; atualizaFotos();
        const remove=await carregaIA();
        f.status='Recortando o produto…'; atualizaFotos();
        const recorte=await remove(f.file,{output:{format:'image/png'},progress:(k,c,t)=>{ if(t){ f.status=`Baixando modelo de IA ${Math.round(c/t*100)}%`; atualizaFotos(); } }});
        f.status='Montando a foto de estúdio…'; atualizaFotos();
        const blob=await montaEstudio(recorte,opt);
        f.out=URL.createObjectURL(blob); f.status='';
      }catch(e){ console.error(e); f.erro=e&&e.message?e.message:'Não foi possível processar esta foto.'; }
      atualizaFotos();
    }
  } finally { filaRodando=false; }
}
let _tf=0; function atualizaFotos(){ if(S.view!=='fotos') return; cancelAnimationFrame(_tf); _tf=requestAnimationFrame(render); }

async function montaEstudio(pngBlob,opt){
  const img=await createImageBitmap(pngBlob);
  // 1) achar a área do produto pelo canal alfa
  const w=img.width,h=img.height, c0=new OffscreenCanvas(w,h), x0=c0.getContext('2d',{willReadFrequently:true});
  x0.drawImage(img,0,0); const id=x0.getImageData(0,0,w,h), d=id.data;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(d[(y*w+x)*4+3]>12){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
  if(maxX<0) throw new Error('A IA não encontrou o produto nesta foto. Tente uma foto com o produto mais visível.');
  // 2) ajuste suave de luz e cor (níveis por canal, sem redesenhar nada)
  if(opt.ajuste!=='nenhum'){
    const forca=opt.ajuste==='medio'?0.85:0.5;
    const hist=[new Uint32Array(256),new Uint32Array(256),new Uint32Array(256)]; let n=0;
    for(let i=0;i<d.length;i+=4){ if(d[i+3]>200){ hist[0][d[i]]++;hist[1][d[i+1]]++;hist[2][d[i+2]]++; n++; } }
    if(n>100){
      const pct=(hh,p)=>{let s=0,t=n*p;for(let v=0;v<256;v++){s+=hh[v];if(s>=t)return v;}return 255;};
      // mesmo ponto preto/branco para os 3 canais = mais contraste sem mexer na cor do produto
      const lo=Math.min(pct(hist[0],.005),pct(hist[1],.005),pct(hist[2],.005));
      const hi=Math.max(pct(hist[0],.995),pct(hist[1],.995),pct(hist[2],.995));
      const lut=new Uint8ClampedArray(256);
      for(let v=0;v<256;v++){ let s=hi>lo+20?(v-lo)*255/(hi-lo):v; s=255*Math.pow(Math.min(1,Math.max(0,s/255)),0.95); lut[v]=Math.round(v+(s-v)*forca); }
      for(let i=0;i<d.length;i+=4){ if(d[i+3]){ d[i]=lut[d[i]]; d[i+1]=lut[d[i+1]]; d[i+2]=lut[d[i+2]]; } }
      x0.putImageData(id,0,0);
    }
  }
  // 3) compor no fundo branco, centralizado e quadrado
  const T=opt.tam, pad=T*opt.margem/100, bw=maxX-minX+1, bh=maxY-minY+1;
  const esc_=Math.min((T-2*pad)/bw,(T-2*pad)/bh), dw=bw*esc_, dh=bh*esc_, dx=(T-dw)/2, dy=(T-dh)/2;
  const c=new OffscreenCanvas(T,T), x=c.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,T,T);
  if(opt.sombra){
    const rx=dw*0.48, ry=Math.max(6,T*0.03);
    x.save(); x.translate(T/2,dy+dh-ry*0.25); x.scale(1,ry/rx);
    const g=x.createRadialGradient(0,0,0,0,0,rx); g.addColorStop(0,'rgba(0,0,0,0.20)'); g.addColorStop(0.6,'rgba(0,0,0,0.07)'); g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.beginPath(); x.arc(0,0,rx,0,Math.PI*2); x.fill(); x.restore();
  }
  x.imageSmoothingQuality='high';
  x.drawImage(c0,minX,minY,bw,bh,dx,dy,dw,dh);
  // 4) nitidez leve (unsharp mask) só onde há produto
  if(opt.ajuste!=='nenhum' && 'filter' in x){
    const amt=opt.ajuste==='medio'?0.35:0.2;
    const a=x.getImageData(0,0,T,T), b=new OffscreenCanvas(T,T), bx=b.getContext('2d');
    bx.filter='blur(1px)'; bx.drawImage(c,0,0); const bl=bx.getImageData(0,0,T,T).data, ad=a.data;
    for(let i=0;i<ad.length;i+=4){ for(let k=0;k<3;k++){ const v=ad[i+k]+(ad[i+k]-bl[i+k])*amt; ad[i+k]=v<0?0:v>255?255:v; } }
    x.putImageData(a,0,0);
  }
  return await c.convertToBlob({type:'image/jpeg',quality:0.92});
}

boot();
</script>
